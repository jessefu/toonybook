<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="80">
  <defs>
    <!-- 图形渐变 -->
    <linearGradient id="tb-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <linearGradient id="tb-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6C5CE7" />
    </linearGradient>
  </defs>

  <!-- 绘本图标背景底板 -->
  <rect x="10" y="10" width="60" height="60" rx="18" fill="url(#tb-bg-grad)" />

  <!-- 打开的绘本 (Book Shape) -->
  <path d="M 22 46 C 22 46 28 41 40 41 C 52 41 58 46 58 46 L 58 28 C 58 28 52 23 40 23 C 28 23 22 28 22 28 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 40 23 L 40 41" stroke="#FF6B4A" stroke-width="2.5" stroke-linecap="round" />

  <!-- 魔法小火花 / 星星 (AI Magic) -->
  <path d="M 40 14 L 42 18 L 46 20 L 42 22 L 40 26 L 38 22 L 34 20 L 38 18 Z" fill="#FFFFFF" />
  <circle cx="23" cy="20" r="2.5" fill="#FFEAA7" />
  <circle cx="56" cy="18" r="3" fill="#6C5CE7" />

  <!-- Logo 文字：ToonyBook -->
  <text x="88" y="47" font-family="'Nunito', 'Source Sans 3', system-ui, sans-serif" font-weight="900" font-size="30" fill="#1E1B4B" letter-spacing="-0.5">
    Toony<tspan fill="#FF6B4A">Book</tspan>
  </text>
  
  <!-- Slogan / Subtitle -->
  <text x="90" y="62" font-family="'Nunito', system-ui, sans-serif" font-weight="700" font-size="11" fill="#6C5CE7" letter-spacing="1.2">
    AI STORYBOOK CREATOR
  </text>
</svg>
